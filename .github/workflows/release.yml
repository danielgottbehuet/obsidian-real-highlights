# Baut das Plugin bei einem Versions-Tag (z. B. 0.1.0, ohne "v") und legt einen
# Release-Entwurf mit main.js, manifest.json und styles.css an.
name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build:plugin

      - name: Tag und Manifest-Version prüfen
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION=$(node -p "require('./manifest.json').version")
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag $TAG passt nicht zur manifest.json-Version $VERSION" >&2
            exit 1
          fi

      - name: Release-Entwurf anlegen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --draft \
            --generate-notes \
            dist/obsidian/main.js manifest.json dist/obsidian/styles.css
