# Baut das Plugin bei einem Versions-Tag (z. B. 0.1.2, ohne "v"), attestiert die
# Herkunft der Release-Dateien und legt einen Release-Entwurf mit main.js,
# manifest.json und styles.css an.
name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write # Release anlegen
  id-token: write # Signatur der Attestierung (Sigstore)
  attestations: write # Attestierung speichern
  artifact-metadata: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint (Regeln des Obsidian-Scanners)
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Tag und Manifest-Version prüfen
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION=$(node -p "require('./manifest.json').version")
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag $TAG passt nicht zur manifest.json-Version $VERSION" >&2
            exit 1
          fi

      - name: Herkunft der Release-Dateien attestieren
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Release-Entwurf anlegen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --draft \
            --generate-notes \
            main.js manifest.json styles.css
